<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1d22"/>
      <stop offset="50%" stop-color="#131417"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)"/>
    </linearGradient>

    <!-- Glow Effect for Studio Dot -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner Shadow for subtle depth -->
    <radialGradient id="surfaceHighlight" cx="50%" cy="15%" r="65%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)"/>
    </radialGradient>

    <!-- Accent Terracotta Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7354"/>
      <stop offset="100%" stop-color="#d8482d"/>
    </linearGradient>

    <!-- Letter T Gradient -->
    <linearGradient id="fgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d7df"/>
    </linearGradient>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <rect x="48" y="48" width="928" height="928" rx="224" ry="224" fill="url(#bgGrad)"/>
  <rect x="48" y="48" width="928" height="928" rx="224" ry="224" fill="url(#surfaceHighlight)"/>
  <rect x="48" y="48" width="928" height="928" rx="224" ry="224" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Teleprompter Screen Frame (Subtle Studio Display) -->
  <rect x="196" y="210" width="632" height="604" rx="48" ry="48" fill="rgba(0, 0, 0, 0.35)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="4"/>

  <!-- Center Icon: Bold Iconic 'T' with Teleprompter Scroll Bars -->
  <!-- Top Crossbar of T -->
  <rect x="290" y="296" width="444" height="88" rx="24" ry="24" fill="url(#fgGrad)"/>

  <!-- Vertical Stem of T -->
  <rect x="468" y="384" width="88" height="340" rx="24" ry="24" fill="url(#fgGrad)"/>

  <!-- Prompter Reading Guide Lines (Left & Right cue marks) -->
  <rect x="290" y="460" width="120" height="20" rx="10" ry="10" fill="rgba(255, 255, 255, 0.22)"/>
  <rect x="614" y="460" width="120" height="20" rx="10" ry="10" fill="rgba(255, 255, 255, 0.22)"/>

  <rect x="330" y="540" width="80" height="16" rx="8" ry="8" fill="rgba(255, 255, 255, 0.12)"/>
  <rect x="614" y="540" width="80" height="16" rx="8" ry="8" fill="rgba(255, 255, 255, 0.12)"/>

  <!-- Studio Live Indicator (Recording / Prompter Focus Dot with Aura) -->
  <circle cx="730" cy="290" r="32" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="730" cy="290" r="28" fill="url(#accentGrad)"/>
  <circle cx="724" cy="284" r="8" fill="rgba(255, 255, 255, 0.65)"/>
</svg>
